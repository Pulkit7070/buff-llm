steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/incidentroom/app:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/incidentroom/app:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/incidentroom/app

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - incidentroom
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/incidentroom/app:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=7860
      - --memory=512Mi
      - --cpu=1
      - --max-instances=10
      - --set-env-vars=PORT=7860

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/incidentroom/app

options:
  logging: CLOUD_LOGGING_ONLY
